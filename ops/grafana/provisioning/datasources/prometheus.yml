# Points Grafana at the Prometheus container from docker-compose.monitoring.yml.
# The uid is fixed because ops/grafana/dashboards/codementor.json refers to it by uid;
# isDefault covers codeatlas-agents.json, whose panels carry no datasource of their own.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
